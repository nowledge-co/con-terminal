[package]
name = "con-core"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
con-agent.workspace = true
con-paths.workspace = true
con-terminal.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
anyhow.workspace = true
log.workspace = true
crossbeam-channel.workspace = true
parking_lot.workspace = true
dirs.workspace = true
uuid = { workspace = true, features = ["serde"] }
futures.workspace = true
tokio.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[lints.rust]
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
