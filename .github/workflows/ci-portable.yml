name: ci-portable

# Cross-platform smoke test for the non-macOS-specific parts of the
# workspace. macOS builds are handled in `release-macos.yml`; this
# workflow guards the Windows/Linux portability of:
#   - con-core  (control socket, named pipes, config, session)
#   - con-cli   (control client, Unix socket + named pipe transport)
#   - con-agent (tokio, rig)
#   - con-terminal (theme helpers)
#   - con-ghostty  (real libghostty-vt backend on Windows and Linux)
#   - con          (the cross-platform UI binary)
#
# Jobs run both checks and linked tests so libghostty-vt ABI or symbol drift
# cannot hide behind Cargo's non-linking `check` path.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci-portable.yml"
      - ".github/workflows/publish-flatpak.yml"
      - ".github/workflows/release-*.yml"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "assets/**"
      - "packaging/**"
      - "docs/**"
      - "crates/**"
      - "scripts/**"
  pull_request:
    paths:
      - ".github/workflows/ci-portable.yml"
      - ".github/workflows/publish-flatpak.yml"
      - ".github/workflows/release-*.yml"
      - ".cargo/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "assets/**"
      - "packaging/**"
      - "docs/**"
      - "crates/**"
      - "scripts/**"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  windows:
    name: check (windows-latest)
    runs-on: windows-latest
    # GitHub hosted runners set $GITHUB_WORKSPACE to D:\a\<repo>\<repo>,
    # which for this repo is D:\a\con\con. `con` is a reserved DOS device
    # name and git.exe rejects any path whose components match one (CON,
    # PRN, AUX, NUL, ...), failing `git init` with EINVAL on `.git`.
    # Putting the checkout under a `path:` subdir doesn't help because
    # the ancestor directory is still `con`. We sidestep the whole tree
    # by cloning into C:\src\repo outside $GITHUB_WORKSPACE and pointing
    # every subsequent step there.
    env:
      CON_CHECKOUT_DIR: C:\src\repo
      ZIG_GLOBAL_CACHE_DIR: C:\zc
    defaults:
      run:
        working-directory: C:\src\repo
    steps:
      - name: Clone repo outside the reserved-name path
        working-directory: C:\
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path $env:CON_CHECKOUT_DIR | Out-Null
          git -c core.longpaths=true clone `
            "https://x-access-token:$env:GH_TOKEN@github.com/${{ github.repository }}.git" `
            $env:CON_CHECKOUT_DIR
          Set-Location $env:CON_CHECKOUT_DIR
          git fetch origin "${{ github.event.pull_request.head.sha || github.sha }}"
          git checkout "${{ github.event.pull_request.head.sha || github.sha }}"
          git log -1 --oneline
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: C:\src\repo
      - name: Prepare short-path Zig cache
        working-directory: C:\
        shell: pwsh
        run: New-Item -ItemType Directory -Force -Path $env:ZIG_GLOBAL_CACHE_DIR | Out-Null
      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0
      - name: PowerShell installer parse check
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "scripts/install.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | Format-List | Out-String | Write-Host
            throw "PowerShell parse errors in scripts/install.ps1"
          }
      - name: cargo check — portable crates
        run: cargo check --locked -p con-core -p con-cli -p con-agent -p con-terminal -p con-ghostty
      - name: cargo check — UI binary
        # The default `bin-con` target compiles to `con.exe`, which Win32
        # file APIs reject because CON is a reserved device name. The
        # `bin-con-app` feature routes the same `main.rs` to `con-app.exe`
        # instead — mirrors what `cargo wbuild` / `cargo wrun` do locally.
        run: cargo check --locked -p con --no-default-features --features con/bin-con-app
      - name: cargo test — portable crates
        run: cargo test --locked -p con-core -p con-cli -p con-agent -p con-terminal -p con-ghostty
      - name: State presentation layout tests
        run: |
          cargo test --locked -p con --no-default-features --features con/bin-con-app --bin con-app sidebar::
          cargo test --locked -p con --no-default-features --features con/bin-con-app --bin con-app terminal_geometry::
          cargo test --locked -p con --no-default-features --features con/bin-con-app --bin con-app terminal_identity::
          cargo test --locked -p con --no-default-features --features con/bin-con-app --bin con-app app_icon::
          cargo test --locked -p con --no-default-features --features con/bin-con-app --bin con-app agent_panel::tests
          cargo test --locked -p con --no-default-features --features con/bin-con-app --bin con-app workspace::render::top_bar
          cargo test --locked -p con --no-default-features --features con/bin-con-app --bin con-app workspace::terminal_status::
          cargo test --locked -p con --no-default-features --features con/bin-con-app --bin con-app workspace::tab_presentation::
          cargo test --locked -p con --no-default-features --features con/bin-con-app --bin con-app workspace::tests::horizontal_tab_reorder
          cargo test --locked -p con --no-default-features --features con/bin-con-app --bin con-app input_bar::tests
          cargo test --locked -p con --no-default-features --features con/bin-con-app --bin con-app editor_
      - name: Program status acceptance fixture tests
        run: |
          python -m unittest discover -s scripts/terminal -p 'test_*.py'
          cargo test --locked -p con-core --example program_status_bench

  linux:
    name: check (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Docs manifest validation
        run: python3 scripts/docs/validate-manifest.py
      - name: Flatpak icon validation
        run: python3 scripts/release/test-flatpak-icon.py
      - name: Program status acceptance fixture tests
        run: python3 -m unittest discover -s scripts/terminal -p 'test_*.py'
      - name: Release script syntax checks
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/install.sh
          bash -n scripts/linux/release.sh
          bash -n scripts/release/verify-artifacts.sh
          bash -n scripts/release/verify-release-gate.sh
          ./scripts/release/verify-artifacts.sh desktop \
            packaging/flatpak/co.nowledge.con.desktop
          for script in scripts/macos/*.sh scripts/sparkle/*.sh; do
            bash -n "$script"
          done
          bash scripts/macos/test-stapler-retry.sh
          bash scripts/macos/test-dependencies.sh
          bash scripts/ci/test-install-zig.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Zig 0.16.0
        shell: bash
        timeout-minutes: 12
        run: bash scripts/ci/install-zig.sh
      - name: apt deps for gpui_linux (wayland/x11 + font stack)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-composite0-dev libxcb-dri2-0-dev libxcb-glx0-dev \
            libxcb-present-dev libxcb-xfixes0-dev libxkbcommon-x11-dev \
            libwayland-dev libvulkan-dev \
            libfreetype-dev libfontconfig1-dev
      - name: cargo check — portable crates
        run: cargo check --locked -p con-core -p con-cli -p con-agent -p con-terminal -p con-ghostty
      - name: cargo check — UI binary
        run: cargo check --locked -p con
      - name: cargo test — portable crates
        run: cargo test --locked -p con-core -p con-cli -p con-agent -p con-terminal -p con-ghostty
      - name: State presentation layout tests
        run: |
          cargo test --locked -p con --bin con sidebar::
          cargo test --locked -p con --bin con terminal_geometry::
          cargo test --locked -p con --bin con terminal_identity::
          cargo test --locked -p con --bin con app_icon::
          cargo test --locked -p con --bin con agent_panel::tests
          cargo test --locked -p con --bin con workspace::render::top_bar
          cargo test --locked -p con --bin con workspace::terminal_status::
          cargo test --locked -p con --bin con workspace::tab_presentation::
          cargo test --locked -p con --bin con workspace::tests::horizontal_tab_reorder
          cargo test --locked -p con --bin con input_bar::tests
          cargo test --locked -p con --bin con editor_
      - name: Program status reducer benchmark correctness
        run: cargo test --locked -p con-core --example program_status_bench
      - name: Linux terminal view regression tests
        run: cargo test --locked -p con --bin con ghostty_view::tests
