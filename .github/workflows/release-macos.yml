name: Release macOS

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  pages: write

jobs:
  build:
    name: Build ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            rust_target: aarch64-apple-darwin
          - runner: macos-15-intel
            arch: x86_64
            rust_target: x86_64-apple-darwin

    steps:
      - uses: actions/checkout@v5

      - name: Test ticket-service retry policy
        shell: bash
        run: |
          bash scripts/macos/test-stapler-retry.sh
          bash scripts/macos/test-prebuilt-app.sh
          bash scripts/macos/test-dependencies.sh

      - name: Derive release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          channel="stable"
          if [[ "$version" == *"-beta."* ]]; then
            channel="beta"
          elif [[ "$version" == *"-dev."* ]]; then
            channel="dev"
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "channel=$channel" >>"$GITHUB_OUTPUT"

      - name: Install macOS dependencies
        shell: bash
        run: bash scripts/macos/prepare-dependencies.sh

      - name: Install Zig 0.17.0
        timeout-minutes: 12
        shell: bash
        run: |
          bash scripts/ci/test-install-zig.sh
          bash scripts/ci/install-zig.sh

      - name: Configure Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup default stable
          rustup target add "${{ matrix.rust_target }}"

      - name: Download Sparkle framework
        shell: bash
        run: ./scripts/sparkle/download.sh

      - name: Build native app bundle
        shell: bash
        env:
          CON_CHANNEL: ${{ steps.meta.outputs.channel }}
          CON_APP_VERSION: ${{ steps.meta.outputs.version }}
          CON_BUILD_NUMBER: ${{ github.run_number }}
          CON_ARCH: ${{ matrix.arch }}
          CON_RUST_TARGET: ${{ matrix.rust_target }}
          CON_SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail
          ./scripts/macos/build-app.sh
          source ./scripts/macos/common.sh
          setup_release_env
          for binary in con con-cli; do
            verify_native_binary_architecture "$CON_APP_BUNDLE_PATH/Contents/MacOS/$binary" "$CON_ARCH"
          done
          "$CON_APP_BUNDLE_PATH/Contents/MacOS/con-cli" --help >/dev/null
          ditto -c -k --keepParent "$CON_APP_BUNDLE_PATH" "$RUNNER_TEMP/native-app.zip"

      - name: Retain native bundle for packaging
        uses: actions/upload-artifact@v5
        with:
          name: native-app-${{ matrix.arch }}
          path: ${{ runner.temp }}/native-app.zip
          if-no-files-found: error
          retention-days: 7

  package:
    name: Package ${{ matrix.arch }}
    needs: build
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: native-app-${{ matrix.arch }}
          path: native-bundle

      - name: Derive release metadata
        id: meta
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          channel="stable"
          case "$version" in
            *-beta.*) channel="beta" ;;
            *-dev.*) channel="dev" ;;
          esac
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "channel=$channel" >>"$GITHUB_OUTPUT"

      - name: Prepare Intel CLI validation on Apple Silicon
        if: matrix.arch == 'x86_64'
        run: /usr/sbin/softwareupdate --install-rosetta --agree-to-license

      - name: Test ticket-service retry policy
        run: |
          bash scripts/macos/test-stapler-retry.sh
          bash scripts/macos/test-prebuilt-app.sh

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: ./scripts/macos/import-certificate.sh

      - name: Sign, notarize, and package native bundle
        env:
          CON_CHANNEL: ${{ steps.meta.outputs.channel }}
          CON_APP_VERSION: ${{ steps.meta.outputs.version }}
          CON_BUILD_NUMBER: ${{ github.run_number }}
          CON_ARCH: ${{ matrix.arch }}
          CON_PREBUILT_APP_ARCHIVE: ${{ github.workspace }}/native-bundle/native-app.zip
          CON_REQUIRE_NOTARIZATION: "1"
          CON_SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_NOTARY_API_KEY_BASE64: ${{ secrets.APPLE_NOTARY_API_KEY_BASE64 }}
        run: ./scripts/macos/release.sh

      - name: Verify release artifact contract
        shell: bash
        env:
          CON_CHANNEL: ${{ steps.meta.outputs.channel }}
          CON_APP_VERSION: ${{ steps.meta.outputs.version }}
          CON_BUILD_NUMBER: ${{ github.run_number }}
          CON_ARCH: ${{ matrix.arch }}
          CON_SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          set -euo pipefail
          source ./scripts/macos/common.sh
          setup_release_env
          ./scripts/release/verify-artifacts.sh macos \
            "$CON_APP_BUNDLE_PATH" \
            "$CON_APP_ZIP_PATH" \
            "$CON_DMG_PATH" \
            "$CON_CHECKSUM_PATH"

      - name: Upload notarized artifacts
        uses: actions/upload-artifact@v5
        with:
          name: macos-${{ matrix.arch }}
          path: dist/macos/${{ steps.meta.outputs.channel }}/${{ matrix.arch }}/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: package

    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          pattern: macos-*
          path: release-artifacts

      - name: Derive release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >>"$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"

          # The release is always created as a --draft so that the
          # tag stays invisible to /releases/latest and to the
          # one-line installers (install.sh / install.ps1) until
          # every platform's assets are attached. See the long-form
          # rationale in release-linux.yml; the short version is that
          # whichever platform job won the create+upload race used to
          # flip the release public immediately, leaving fresh
          # installers chasing
          #   ✗ no ZIP found for windows-x86_64
          # (or the macOS/Linux equivalents) until the slower
          # platforms caught up. That's the bug
          # `irm https://nowled.ge/con-ps1 | iex` hit on
          # v0.1.0-beta.35.
          #
          # Drafts are atomically promoted to public by
          # .github/workflows/release-finalize.yml once every
          # release-{linux,macos,windows}.yml workflow_run reports a
          # `success` conclusion for the same tag. If any platform
          # fails, the draft stays drafted (intentional — better to
          # block than to ship an incomplete release).
          #
          # --prerelease is still set on `v*-dev.*` as defence in
          # depth (in case someone publishes the draft manually).
          # Beta tags are NOT marked --prerelease today: con is in an
          # all-betas era and the latest beta IS what fresh
          # install.sh should download once the finalize step
          # promotes the release.
          prerelease_args=()
          case "$tag" in
            *-dev.*) prerelease_args+=(--prerelease) ;;
          esac

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --generate-notes \
              --draft "${prerelease_args[@]}"
          fi

          # Upload files one at a time to avoid GitHub API race conditions.
          # xargs can invoke multiple gh processes that compete for the same
          # upload endpoint, causing spurious 404s.
          while IFS= read -r -d '' file; do
            echo "Uploading: $file"
            gh release upload "$tag" "$file" --clobber
          done < <(find release-artifacts -type f \
            \( -name '*.zip' -o -name '*.dmg' -o -name 'SHA256SUMS-macos-*.txt' \) \
            -print0)

  update-appcast:
    name: Prepare signed updater metadata
    concurrency:
      # Keep macOS retries independent from the other platform jobs. The
      # push below rebases against the shared branch when another platform
      # publishes first.
      group: con-gh-pages-publish-macos
      cancel-in-progress: false
    runs-on: macos-15
    needs: publish

    steps:
      - uses: actions/checkout@v5

      - name: Derive release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          channel="stable"
          if [[ "$version" == *"-beta."* ]]; then
            channel="beta"
          elif [[ "$version" == *"-dev."* ]]; then
            channel="dev"
          fi
          marketing="${version%%[-+]*}"
          {
            echo "version=$version"
            echo "channel=$channel"
            echo "marketing=$marketing"
          } >>"$GITHUB_OUTPUT"

      - name: Check Sparkle signing key
        id: sparkle
        if: steps.meta.outputs.channel != 'dev'
        shell: bash
        env:
          SPARKLE_SIGNING_KEY: ${{ secrets.SPARKLE_SIGNING_KEY }}
        run: |
          if [[ -z "${SPARKLE_SIGNING_KEY:-}" ]]; then
            echo "available=false" >>"$GITHUB_OUTPUT"
            echo "::error::SPARKLE_SIGNING_KEY not set — cannot prepare signed updater metadata"
            exit 1
          else
            echo "available=true" >>"$GITHUB_OUTPUT"
          fi

      - name: Download Sparkle tools
        if: steps.meta.outputs.channel != 'dev' && steps.sparkle.outputs.available == 'true'
        shell: bash
        run: ./scripts/sparkle/download.sh

      - name: Download release artifacts
        if: steps.meta.outputs.channel != 'dev' && steps.sparkle.outputs.available == 'true'
        uses: actions/download-artifact@v5
        with:
          pattern: macos-*
          path: release-artifacts

      - name: Checkout gh-pages
        if: steps.meta.outputs.channel != 'dev' && steps.sparkle.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Clone existing gh-pages or create the branch inline.
          # Uses fetch+checkout to be resilient to concurrent runs.
          git clone --single-branch --branch gh-pages \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            gh-pages 2>/dev/null || {
            mkdir -p "gh-pages/release-staging/$GITHUB_REF_NAME/appcast"
            cd gh-pages
            git init
            git checkout -b gh-pages
            git remote add origin \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
            echo "con-releases.nowledge.co" > CNAME
            touch .nojekyll
            git add CNAME .nojekyll
            git commit -m "Initialize gh-pages"
          }

      - name: Sign artifacts and update appcasts
        if: steps.meta.outputs.channel != 'dev' && steps.sparkle.outputs.available == 'true'
        shell: bash
        env:
          SPARKLE_SIGNING_KEY: ${{ secrets.SPARKLE_SIGNING_KEY }}
          SPARKLE_DIR: ${{ github.workspace }}/.sparkle
        run: |
          set -euo pipefail

          repo="${{ github.repository }}"
          tag="$GITHUB_REF_NAME"
          channel="${{ steps.meta.outputs.channel }}"
          marketing="${{ steps.meta.outputs.marketing }}"
          build_number="${{ github.run_number }}"

          mkdir -p "gh-pages/release-staging/$GITHUB_REF_NAME/appcast"

          for arch in arm64 x86_64; do
            # Find the DMG for this arch
            dmg=$(find release-artifacts -name "*-macos-${arch}.dmg" -type f | head -1)
            if [[ -z "$dmg" ]]; then
              echo "::error::No DMG found for $arch"
              exit 1
            fi

            # Sign the artifact and extract signature
            sig_output=$(./scripts/sparkle/sign-artifact.sh "$dmg")
            signature=$(echo "$sig_output" | sed -n 's/.*edSignature="\([^"]*\)".*/\1/p')
            if [[ -z "$signature" ]]; then
              echo "::error::Failed to extract Ed25519 signature for $arch"
              echo "sign_update output: $sig_output" >&2
              exit 1
            fi
            length=$(stat -f%z "$dmg")

            # GitHub Release download URL for this artifact
            dmg_name=$(basename "$dmg")
            download_url="https://github.com/${repo}/releases/download/${tag}/${dmg_name}"

            # Update the appcast for this channel+arch
            appcast_file="gh-pages/release-staging/${tag}/appcast/${channel}-macos-${arch}.xml"

            APPCAST_FILE="$appcast_file" \
            APPCAST_TITLE="con" \
            APPCAST_LINK="https://con-releases.nowledge.co" \
            ITEM_TITLE="Version ${marketing}" \
            ITEM_VERSION="$build_number" \
            ITEM_SHORT_VERSION="$marketing" \
            ITEM_URL="$download_url" \
            ITEM_LENGTH="$length" \
            ITEM_SIGNATURE="$signature" \
            ITEM_MIN_OS="10.15.7" \
            ./scripts/sparkle/update-appcast.sh

            echo "Updated appcast: ${channel}-macos-${arch}.xml (build $build_number)"
          done

      - name: Stage signed appcasts without notifying clients
        if: steps.meta.outputs.channel != 'dev' && steps.sparkle.outputs.available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "release-staging/$GITHUB_REF_NAME/appcast/"
          if git diff --cached --quiet; then
            echo "No appcast changes to commit"
            exit 0
          fi
          git commit -m "Update appcast for $GITHUB_REF_NAME"
          for attempt in 1 2 3 4 5; do
            git fetch origin gh-pages
            if git rebase origin/gh-pages && git push origin gh-pages; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            if [[ "$attempt" -eq 5 ]]; then
              echo "::error::Unable to push macOS appcast after $attempt attempts"
              exit 1
            fi
            sleep $((attempt * 2))
          done
