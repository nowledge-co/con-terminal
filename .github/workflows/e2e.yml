name: e2e

# End-to-end tests using con-test against a real con process.
# Runs on macOS only — con requires a display for the GPUI window.
# con-test launches con automatically, resets state between files,
# and kills the process on exit.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/e2e.yml"
      - "scripts/ci/**"
      - "crates/con-test/**"
      - "crates/con-app/**"
      - "crates/con-core/**"
      - "crates/con-cli/**"
      - "crates/con-ghostty/**"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - ".github/workflows/e2e.yml"
      - "scripts/ci/**"
      - "crates/con-test/**"
      - "crates/con-app/**"
      - "crates/con-core/**"
      - "crates/con-cli/**"
      - "crates/con-ghostty/**"
      - "Cargo.toml"
      - "Cargo.lock"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Suppress con's own log output during tests
  RUST_LOG: error

jobs:
  e2e:
    name: e2e (macos-15)
    # Keep e2e on the same stable macOS generation as release builds.
    runs-on: macos-15
    # Zig provisioning and a cold Rust/Ghostty build share this budget with
    # the tests. Keep con-test's startup timeout separate and unchanged.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install Zig 0.17.0
        shell: bash
        timeout-minutes: 12
        run: |
          bash scripts/ci/test-install-zig.sh
          bash scripts/ci/install-zig.sh

      - name: Build con, con-cli, con-test
        run: cargo build -p con -p con-cli -p con-test

      - name: Run con-test unit tests (parser)
        run: cargo test -p con-test

      - name: Run E2E tests
        run: |
          ./target/debug/con-test \
            --startup-timeout 30 \
            crates/con-test/testdata/
        env:
          # Write con logs to a file so they don't pollute test output.
          # Uploaded as an artifact on failure for debugging.
          CON_LOG_FILE: /tmp/con-e2e.log

      - name: Upload con log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: con-e2e-log
          path: /tmp/con-e2e.log
          retention-days: 7
