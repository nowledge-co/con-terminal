name: ci-macos-ghostty

on:
  pull_request:
    paths:
      - "crates/con-ghostty/**"
      - "Cargo.lock"
  workflow_dispatch:

# Read-only checks: newer work supersedes older runs on the same PR/ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-intel:
    name: Build libghostty (macOS x86_64)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.17.0
      - name: Test native and portable VT bindings
        env:
          CON_REQUIRE_GHOSTTY_INITIAL_OUTPUT: "1"
          CON_GHOSTTY_PREFETCH_DEPS: "1"
        run: cargo test --locked --release --target x86_64-apple-darwin -p con-ghostty --features vt-tests
      - name: Build release binaries without signing
        if: github.event_name == 'workflow_dispatch'
        env:
          CON_REQUIRE_GHOSTTY_INITIAL_OUTPUT: "1"
          CON_GHOSTTY_PREFETCH_DEPS: "1"
        run: cargo build --locked --release --target x86_64-apple-darwin -p con -p con-cli
