name: ci-macos-ghostty

on:
  pull_request:
    paths:
      - ".github/workflows/ci-macos-ghostty.yml"
      - "crates/con-ghostty/**"
      - "Cargo.lock"
  workflow_dispatch:

jobs:
  build-intel:
    name: Build libghostty (macOS x86_64)
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0
      - name: Build release binaries without signing
        env:
          CON_REQUIRE_GHOSTTY_INITIAL_OUTPUT: "1"
          CON_GHOSTTY_PREFETCH_DEPS: "1"
        run: cargo build --locked --release --target x86_64-apple-darwin -p con -p con-cli
