name: Publish Flatpak Repo

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  schedule:
    - cron: "0 0 * * *" # Run at midnight UTC every day for nightly builds
  workflow_dispatch: # Allow manual runs
    inputs:
      channel:
        description: "Release channel"
        required: false
        default: "unstable"
        type: choice
        options:
          - unstable
          - stable
          - beta
          - dev
          - nightly

permissions:
  contents: write
  packages: write

# Flatpak, appcast, and release-finalization jobs all update the same
# gh-pages branch. Serialize those writers to avoid losing an update.
concurrency:
  group: con-gh-pages-publish
  cancel-in-progress: false

jobs:
  release-channel:
    name: Resolve release channel
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.channel.outputs.channel }}
    steps:
      - name: Resolve channel
        id: channel
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            channel="nightly"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            case "$GITHUB_REF_NAME" in
              v*-beta.*) channel="beta" ;;
              v*-dev.*) channel="dev" ;;
              *)         channel="stable" ;;
            esac
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            channel="unstable"
          else
            channel="unstable"
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

  build-flatpak:
    name: Build Flatpak (${{ matrix.arch }})
    needs: release-channel
    runs-on: ${{ matrix.runner }}
    container:
      image: ghcr.io/aetherpak/cli:v0.33.2-builder
      options: --privileged
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm # Native GitHub Actions ARM64 runner
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            echo "channel=nightly" >> "$GITHUB_OUTPUT"
            echo "version=0.1.0-nightly-$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            # Extract version from tag (e.g., v0.1.2 -> 0.1.2)
            version="${GITHUB_REF_NAME#v}"
            case "$GITHUB_REF_NAME" in
              v*-beta.*) channel="beta" ;;
              v*-dev.*)  channel="dev" ;;
              *)         channel="stable" ;;
            esac
            echo "channel=$channel" >> "$GITHUB_OUTPUT"
            echo "version=$version" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref_name }}" == "main" ]]; then
            # Main branch build -> unstable
            short_sha="${GITHUB_SHA:0:7}"
            echo "channel=unstable" >> "$GITHUB_OUTPUT"
            echo "version=0.1.0-unstable-${short_sha}" >> "$GITHUB_OUTPUT"
          else
            channel="${{ inputs.channel || 'unstable' }}"
            echo "channel=$channel" >> "$GITHUB_OUTPUT"
            echo "version=0.1.0-${channel}-$(date +'%Y%m%d')" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Rust and Cargo
        uses: actions-rust-lang/setup-rust-toolchain@v1

      - name: Install Zig Compiler
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: 0.16.0

      - name: Configure Zig C toolchain
        shell: bash
        run: |
          set -euo pipefail
          tool_dir="$RUNNER_TEMP/con-zig-tools"
          mkdir -p "$tool_dir"
          case "${{ matrix.arch }}" in
            x86_64) zig_target="x86_64-linux-gnu.2.38" ;;
            aarch64) zig_target="aarch64-linux-gnu.2.38" ;;
            *) echo "unsupported Flatpak architecture: ${{ matrix.arch }}" >&2; exit 1 ;;
          esac

          # The AetherPak builder intentionally stays minimal and does not
          # provide a host C compiler. Keep native C build scripts (for
          # example aws-lc-sys) deterministic without adding an apt-based
          # toolchain to the image.
          cat > "$tool_dir/cc" <<'EOF'
          #!/usr/bin/env bash
          args=()
          for arg in "$@"; do
            case "$arg" in
              --target=*-unknown-linux-gnu) args+=("--target=$zig_target") ;;
              *) args+=("$arg") ;;
            esac
          done
          exec zig cc "${args[@]}"
          EOF
          cat > "$tool_dir/c++" <<'EOF'
          #!/usr/bin/env bash
          args=()
          for arg in "$@"; do
            case "$arg" in
              --target=*-unknown-linux-gnu) args+=("--target=$zig_target") ;;
              *) args+=("$arg") ;;
            esac
          done
          exec zig c++ "${args[@]}"
          EOF
          chmod +x "$tool_dir/cc" "$tool_dir/c++"
          sed -i "s/\$zig_target/${zig_target}/g" "$tool_dir/cc" "$tool_dir/c++"
          ln -sf cc "$tool_dir/clang"
          ln -sf c++ "$tool_dir/clang++"

          echo "$tool_dir" >> "$GITHUB_PATH"
          echo "CC=$tool_dir/cc" >> "$GITHUB_ENV"
          echo "CXX=$tool_dir/c++" >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache \
              pkgconf \
              fontconfig-dev \
              libxkbcommon-dev \
              libxkbcommon-x11 \
              libxcb-dev
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              pkg-config \
              libfontconfig1-dev \
              libxkbcommon-dev \
              libxkbcommon-x11-dev \
              libxcb1-dev
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y \
              pkgconf-pkg-config \
              fontconfig-devel \
              libxkbcommon-devel \
              libxkbcommon-x11-devel \
              libxcb-devel
          elif command -v microdnf >/dev/null 2>&1; then
            microdnf install -y \
              pkgconf-pkg-config \
              fontconfig-devel \
              libxkbcommon-devel \
              libxkbcommon-x11-devel \
              libxcb-devel
          else
            echo "no supported Linux package manager found for fontconfig dependencies" >&2
            exit 1
          fi

      - name: Compile Release Binaries
        env:
          CON_RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          CON_RELEASE_CHANNEL: ${{ steps.meta.outputs.channel }}
          CON_LINUX_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          ./scripts/linux/release.sh

      - name: Audit Dynamic Library Dependencies
        run: |
          set -euo pipefail
          stage_dir="$(find dist -maxdepth 1 -type d -name 'con-*-linux-*' -printf '%T@ %p\n' 2>/dev/null | sort -nr | head -1 | cut -d' ' -f2- || true)"
          if [[ -n "${stage_dir}" && -d "${stage_dir}" ]]; then
            echo "==> Auditing dynamic library linkage in ${stage_dir}..."
            for bin in "${stage_dir}/con" "${stage_dir}/con-cli"; do
              if [[ -f "${bin}" ]]; then
                echo "--- ldd ${bin} ---"
                ldd "${bin}"
                if ldd "${bin}" | grep -i "not found"; then
                  echo "::error::Missing dynamic library dependency detected in ${bin}"
                  exit 1
                fi
              fi
            done
          fi

      - name: Build Flatpak Bundle (Zero-Manifest)
        id: build
        uses: aetherpak/actions/build@v3
        with:
          config: packaging/flatpak/aetherpak.yaml
          app-id: co.nowledge.con
          arch: ${{ matrix.arch }}
          branch: ${{ steps.meta.outputs.channel }}
          run-linter: true
          upload-bundle: true

      - name: Smoke Test Flatpak Bundle
        run: |
          set -euo pipefail
          echo "==> Installing bundle into local test environment..."
          flatpak install --user -y "${{ steps.build.outputs.bundle-path }}"
          echo "==> Verifying Flatpak registration and metadata..."
          flatpak info co.nowledge.con
          echo "==> Verifying CLI execution inside Flatpak sandbox..."
          flatpak run --command=con-cli co.nowledge.con --help

  publish-repo:
    name: Publish Repository
    needs: [release-channel, build-flatpak]
    uses: aetherpak/actions/.github/workflows/publish.yml@v3
    with:
      config: packaging/flatpak/aetherpak-publish.yaml
      branch: ${{ needs.release-channel.outputs.channel }}
      # The binaries are built by this workflow and passed in as prebuilt
      # bundles. Do not let AetherPak's source-change detector skip importing
      # them when only release metadata or channel configuration changed.
      force-all: true
      prebuilt-bundle-artifact: flatpak-bundle-{app-id}-{arch}
      pages-url: https://con-releases.nowledge.co
      site-subpath: flatpak
      deploy: false
      signing: auto
    secrets:
      gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
      gpg-private-key-passphrase: ${{ secrets.GPG_PRIVATE_KEY_PASSPHRASE }}

  deploy-site:
    name: Deploy to gh-pages
    needs: publish-repo
    runs-on: ubuntu-latest
    steps:
      - name: Download site artifact
        uses: actions/download-artifact@v5
        with:
          name: aetherpak-site
          path: _site

      - name: Deploy Flatpak Repo to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: _site/flatpak
          destination_dir: flatpak
          keep_files: true
