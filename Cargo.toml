[workspace]
members = [
    "crates/con-app",
    "crates/con-core",
    "crates/con-paths",
    "crates/con-terminal",
    "crates/con-ghostty",
    "crates/con-agent",
    "crates/con-cli",
    "crates/con-test",
]
default-members = ["crates/con-app"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
# Internal crates
con-core = { path = "crates/con-core" }
con-paths = { path = "crates/con-paths" }
con-terminal = { path = "crates/con-terminal" }
con-ghostty = { path = "crates/con-ghostty" }
con-agent = { path = "crates/con-agent" }

# UI — Zed's GPUI via the `gpui-pre-*` crates.io snapshots (0.3.6 = zed@bcf6582).
# Pin them exactly to the snapshot gpui-component was released against and bump
# both together: any snapshot may change GPUI's API, and two snapshots in one
# tree are incompatible types.
gpui = { package = "gpui-pre", version = "=0.3.6" }
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.6", features = ["font-kit", "runtime_shaders", "wayland", "x11"] }
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.6" }

# UI Components — upstream gpui-component, never local 3pp paths
gpui-component = "=0.6.6"
gpui-kit-assets = "=0.6.6"

# AI Agent
rig = { package = "rig-core", version = "0.40.0", default-features = false, features = ["rustls"] }

# Async
tokio = { version = "1", features = ["full"] }
futures = "0.3"
smol = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
toml = "0.8"
schemars = "1"

# Text & Language
ropey = { version = "=2.0.0-beta.1", features = ["metric_lines_lf", "metric_utf16"] }
sum-tree = { version = "0.2.0", package = "zed-sum-tree" }
rust-i18n = "3"
lsp-types = { version = "0.97.0", features = ["proposed"] }
unicode-width = "0.2"
html5ever = "0.39.0"
markup5ever_rcdom = "=0.39.0"

# Utilities
anyhow = "1"
thiserror = "2"
log = "0.4"
tracing = "0.1"
env_logger = "0.11"
crossbeam-channel = "0.5"
parking_lot = "0.12"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
gethostname = "1"
notify = "7.0.0"
smallvec = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
http = "1"
url = "2"
rust-embed = { version = "8.7.2", features = ["interpolate-folder-path", "include-exclude"] }
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
mathjax-svg-rs = "0.4.0"

[workspace.lints.clippy]
# Inherited by gpui-component crates
almost_complete_range = "allow"
arc_with_non_send_sync = "allow"
borrowed_box = "allow"
let_underscore_future = "allow"
manual_is_multiple_of = "allow"
map_entry = "allow"
module_inception = "allow"
non_canonical_partial_ord_impl = "allow"
reversed_empty_ranges = "allow"
single_range_in_vec_init = "allow"
style = { level = "allow", priority = -1 }
type_complexity = "allow"
useless_conversion = "allow"

[profile.dev]
split-debuginfo = "unpacked"
opt-level = 1

[profile.release]
lto = "thin"
codegen-units = 1
